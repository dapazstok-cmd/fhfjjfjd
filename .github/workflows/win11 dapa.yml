name: DapaX Windows RDP

on:
  workflow_dispatch:

concurrency:
  group: dapax-rdp
  cancel-in-progress: false

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # GENERATE DAPAX NAME + PASSWORD
      # ==========================================
      - name: Generate DapaX Credentials
        id: credentials
        shell: pwsh
        run: |

          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()

          function RandomNumber {
              $bytes = New-Object byte[] 4
              $rng.GetBytes($bytes)
              return ([BitConverter]::ToUInt32($bytes,0) % 90) + 10
          }

          function RandomChar($chars) {
              $bytes = New-Object byte[] 4
              $rng.GetBytes($bytes)
              $index = [BitConverter]::ToUInt32($bytes,0) % $chars.Length
              return $chars[$index]
          }

          # DapaX + 2 angka
          $number = RandomNumber
          $computerName = "DapaX$number"

          # Password total 8 karakter
          # DapaX + 3 karakter
          $upper  = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower  = "abcdefghijkmnopqrstuvwxyz"
          $digits = "23456789"

          $passwordChars = @(
              (RandomChar $upper)
              (RandomChar $lower)
              (RandomChar $digits)
          )

          $password = "DapaX" + ($passwordChars -join "")

          $rng.Dispose()

          "DAPAX_COMPUTER_NAME=$computerName" >> $env:GITHUB_ENV
          "DAPAX_USERNAME=$computerName" >> $env:GITHUB_ENV
          "DAPAX_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       DAPAX CREDENTIALS GENERATED"
          Write-Host "=========================================="
          Write-Host "Computer : $computerName"
          Write-Host "Username : $computerName"
          Write-Host "Password : $password"
          Write-Host "=========================================="

          @"
          # DapaX RDP Credentials

          | Item | Value |
          |---|---|
          | Computer Name | $computerName |
          | Username | $computerName |
          | Password | $password |
          | RDP Port | 3389 |

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append


      # ==========================================
      # SYSTEM INFORMATION
      # ==========================================
      - name: System Information
        shell: pwsh
        run: |

          Write-Host "=========================================="
          Write-Host "          DAPAX WINDOWS RDP"
          Write-Host "=========================================="

          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          $cs = Get-CimInstance Win32_ComputerSystem
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"

          Write-Host "Computer : $env:DAPAX_COMPUTER_NAME"
          Write-Host "OS       : $($os.Caption)"
          Write-Host "CPU      : $($cpu.Name)"
          Write-Host "Core     : $($cpu.NumberOfCores)"
          Write-Host "Threads  : $($cpu.NumberOfLogicalProcessors)"
          Write-Host "RAM      : $([math]::Round($cs.TotalPhysicalMemory / 1GB,2)) GB"
          Write-Host "Disk     : $([math]::Round($disk.FreeSpace / 1GB,2)) GB free"

          Get-CimInstance Win32_VideoController |
            ForEach-Object {
              Write-Host "GPU      : $($_.Name)"
            }

          Write-Host "=========================================="


      # ==========================================
      # RENAME WINDOWS COMPUTER
      # ==========================================
      - name: Rename Windows Computer
        shell: pwsh
        run: |

          Write-Host "Renaming Windows to $env:DAPAX_COMPUTER_NAME..."

          try {

              Rename-Computer `
                -NewName "$env:DAPAX_COMPUTER_NAME" `
                -Force `
                -ErrorAction Stop

              Write-Host "Computer rename command completed."

          }
          catch {

              Write-Host "Hostname rename warning:"
              Write-Host $_
          }


      # ==========================================
      # DISABLE WINDOWS TEST MODE
      # ==========================================
      - name: Disable Windows Test Mode
        shell: pwsh
        run: |

          Write-Host "Checking Windows Test Mode..."

          try {
              bcdedit /set testsigning off
          }
          catch {
              Write-Host "testsigning setting warning."
          }

          try {
              bcdedit /set nointegritychecks off
          }
          catch {
              Write-Host "nointegritychecks setting warning."
          }

          Write-Host "Test Mode configuration checked."
          Write-Host ""
          Write-Host "NOTE: watermark may require restart."


      # ==========================================
      # ENABLE RDP
      # ==========================================
      - name: Enable Remote Desktop
        shell: pwsh
        run: |

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."


      # ==========================================
      # CREATE DAPAX USER
      # ==========================================
      - name: Create DapaX RDP User
        shell: pwsh
        run: |

          $username = "$env:DAPAX_USERNAME"

          Write-Host "Creating user: $username"

          $securePassword = ConvertTo-SecureString `
            "$env:DAPAX_PASSWORD" `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {

              Write-Host "User already exists."
              Write-Host "Updating password..."

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

              Enable-LocalUser `
                -Name $username

          }
          else {

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "DapaX RDP Account"

              Write-Host "User created."
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "$username" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "$username" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          DAPAX USER READY"
          Write-Host "=========================================="
          Write-Host "Username : $username"
          Write-Host "Password : $env:DAPAX_PASSWORD"
          Write-Host "=========================================="


      # ==========================================
      # INSTALL BLUESTACKS
      # ==========================================
      - name: Install BlueStacks
        shell: pwsh
        continue-on-error: true
        run: |

          Write-Host "=========================================="
          Write-Host "        INSTALLING BLUESTACKS"
          Write-Host "=========================================="

          $installer = "$env:TEMP\BlueStacksInstaller.exe"

          try {

              Write-Host "Opening official BlueStacks download page..."

              $response = Invoke-WebRequest `
                -Uri "https://www.bluestacks.com/download.html" `
                -UseBasicParsing

              $html = $response.Content

              # Regex menggunakan double quote agar tidak
              # bentrok dengan karakter apostrophe.
              $pattern = "https?[^`"']+\.exe"

              $matches = [regex]::Matches(
                  $html,
                  $pattern
              )

              $downloadUrl = $null

              foreach ($match in $matches) {

                  $url = $match.Value

                  if ($url -match "bluestacks") {
                      $downloadUrl = $url
                      break
                  }
              }

              if (-not $downloadUrl) {

                  Write-Host "Installer BlueStacks tidak ditemukan."
                  Write-Host "BlueStacks dilewati."
                  exit 0
              }

              Write-Host "Installer ditemukan."
              Write-Host "Downloading BlueStacks..."

              Invoke-WebRequest `
                -Uri $downloadUrl `
                -OutFile $installer `
                -UseBasicParsing

              if (-not (Test-Path $installer)) {

                  Write-Host "Installer tidak berhasil didownload."
                  exit 0
              }

              Write-Host "Starting BlueStacks installer..."

              $process = Start-Process `
                -FilePath $installer `
                -ArgumentList "-s" `
                -Wait `
                -PassThru

              Write-Host "BlueStacks exit code: $($process.ExitCode)"

              if ($process.ExitCode -eq 0) {
                  Write-Host "BlueStacks installation finished."
              }
              else {
                  Write-Host "BlueStacks installer selesai dengan warning."
              }

          }
          catch {

              Write-Host "BlueStacks installation failed:"
              Write-Host $_
              Write-Host "Melanjutkan workflow..."
          }


      # ==========================================
      # INSTALL DISCORD
      # ==========================================
      - name: Install Discord
        shell: pwsh
        continue-on-error: true
        run: |

          Write-Host "=========================================="
          Write-Host "          INSTALLING DISCORD"
          Write-Host "=========================================="

          $installer = "$env:TEMP\DiscordSetup.exe"

          try {

              Write-Host "Downloading Discord..."

              $downloadUrl = "https://discord.com/api/download?platform=win"

              Invoke-WebRequest `
                -Uri $downloadUrl `
                -OutFile $installer `
                -UseBasicParsing

              if (-not (Test-Path $installer)) {

                  Write-Host "Discord installer tidak ditemukan."
                  exit 0
              }

              $size = (Get-Item $installer).Length

              Write-Host "Installer size: $size bytes"

              if ($size -lt 100000) {

                  Write-Host "File Discord terlalu kecil."
                  Write-Host "Download kemungkinan gagal."
                  exit 0
              }

              Write-Host "Starting Discord installer..."

              $process = Start-Process `
                -FilePath $installer `
                -ArgumentList "-s" `
                -Wait `
                -PassThru

              Write-Host "Discord exit code: $($process.ExitCode)"

              if ($process.ExitCode -eq 0) {

                  Write-Host "Discord installation completed."

              }
              else {

                  Write-Host "Discord installer selesai dengan warning."
              }

          }
          catch {

              Write-Host "Discord installation failed:"
              Write-Host $_
              Write-Host "Melanjutkan workflow..."
          }


      # ==========================================
      # INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: pwsh
        run: |

          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer `
            -UseBasicParsing

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {

              Write-Error "Tailscale installation failed."
              exit $process.ExitCode
          }

          if (-not (Test-Path "C:\Program Files\Tailscale\tailscale.exe")) {

              Write-Error "tailscale.exe tidak ditemukan."
              exit 1
          }

          Write-Host "Tailscale installed."


      # ==========================================
      # CONNECT TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

        run: |

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {

              Write-Error "TAILSCALE_AUTH_KEY belum dibuat di Repository Secrets."
              exit 1
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host "Connecting Tailscale..."

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="dapax-rdp-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Tailscale gagal terhubung."
              exit $LASTEXITCODE
          }

          Start-Sleep -Seconds 5

          Write-Host "Tailscale connected."


      # ==========================================
      # FIREWALL
      # ==========================================
      - name: Configure Tailscale RDP Firewall
        shell: pwsh
        run: |

          netsh advfirewall firewall delete rule `
            name="DapaX-RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="DapaX-RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Write-Host "Firewall rule created."


      # ==========================================
      # GET TAILSCALE IP
      # ==========================================
      - name: Get DapaX RDP Address
        shell: pwsh
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          Start-Sleep -Seconds 5

          $ip = & $tailscale ip -4 |
            Select-Object -First 1

          $ip = $ip.ToString().Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {

              Write-Error "Tailscale IP tidak ditemukan."
              exit 1
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          DAPAX RDP READY"
          Write-Host "=========================================="
          Write-Host "PC NAME : $env:DAPAX_COMPUTER_NAME"
          Write-Host "IP      : $ip"
          Write-Host "USER    : $env:DAPAX_USERNAME"
          Write-Host "PASS    : $env:DAPAX_PASSWORD"
          Write-Host "PORT    : 3389"
          Write-Host "=========================================="

          @"

          # DapaX RDP READY

          ## Connection

          **PC Name / Address**

          $ip

          **Windows Name**

          $env:DAPAX_COMPUTER_NAME

          **Username**

          $env:DAPAX_USERNAME

          **Password**

          $env:DAPAX_PASSWORD

          **Port**

          3389

          ## Installed Apps

          - BlueStacks
          - Discord
          - Tailscale
          - Windows Remote Desktop

          ## Windows App

          PC name:
          $ip

          Username:
          $env:DAPAX_USERNAME

          Password:
          $env:DAPAX_PASSWORD

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append


      # ==========================================
      # VERIFY RDP
      # ==========================================
      - name: Verify RDP
        shell: pwsh
        run: |

          Write-Host "Testing local RDP port..."

          Start-Sleep -Seconds 3

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if ($test.TcpTestSucceeded) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "       RDP PORT 3389 : ONLINE"
              Write-Host "       DAPAX RDP     : READY"
              Write-Host "=========================================="

          }
          else {

              Write-Error "RDP port 3389 tidak terbuka."
              exit 1
          }


      # ==========================================
      # KEEP ALIVE
      # ==========================================
      - name: Keep DapaX RDP Alive
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          DAPAX RDP ACTIVE"
          Write-Host "=========================================="
          Write-Host "PC Name  : $env:DAPAX_COMPUTER_NAME"
          Write-Host "IP       : $env:TAILSCALE_IP"
          Write-Host "Username : $env:DAPAX_USERNAME"
          Write-Host "Password : $env:DAPAX_PASSWORD"
          Write-Host ""
          Write-Host "JANGAN CANCEL WORKFLOW."
          Write-Host "=========================================="

          while ($true) {

              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] $env:DAPAX_COMPUTER_NAME RDP ACTIVE"

              Start-Sleep -Seconds 60
          }
