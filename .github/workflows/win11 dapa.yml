name: DapaX Windows RDP

on:
  workflow_dispatch:

concurrency:
  group: dapax-rdp
  cancel-in-progress: false

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # SYSTEM INFO
      # ==========================================
      - name: System Information
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "             DAPAX WINDOWS RDP"
          Write-Host "=========================================="

          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          $cs = Get-CimInstance Win32_ComputerSystem
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"

          Write-Host "OS   : $($os.Caption)"
          Write-Host "CPU  : $($cpu.Name)"
          Write-Host "Core : $($cpu.NumberOfCores)"
          Write-Host "RAM  : $([math]::Round($cs.TotalPhysicalMemory / 1GB,2)) GB"
          Write-Host "Disk : $([math]::Round($disk.FreeSpace / 1GB,2)) GB free"

          Get-CimInstance Win32_VideoController |
            ForEach-Object {
              Write-Host "GPU  : $($_.Name)"
            }

          Write-Host "=========================================="

      # ==========================================
      # GENERATE RANDOM PASSWORD
      # ==========================================
      - name: Generate DapaX Password
        id: password
        shell: pwsh
        run: |

          $upper  = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower  = "abcdefghijkmnopqrstuvwxyz"
          $number = "23456789"
          $symbol = "!@#$%"

          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()

          function Get-RandomChar($chars) {
              $bytes = New-Object byte[] 4
              $rng.GetBytes($bytes)
              $index = [BitConverter]::ToUInt32($bytes,0) % $chars.Length
              return $chars[$index]
          }

          # Pastikan memenuhi kompleksitas password Windows
          $chars = @(
              Get-RandomChar $upper
              Get-RandomChar $lower
              Get-RandomChar $number
              Get-RandomChar $symbol
          )

          $all = $upper + $lower + $number + $symbol

          for ($i = 0; $i -lt 16; $i++) {
              $chars += Get-RandomChar $all
          }

          # Shuffle
          $password = ($chars | Sort-Object { Get-Random }) -join ""

          $rng.Dispose()

          # Simpan untuk step berikutnya
          "DAPAX_PASSWORD=$password" >> $env:GITHUB_ENV

          # Output biasa
          "password=$password" >> $env:GITHUB_OUTPUT

          # Tampilkan di log
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          DAPAX RDP PASSWORD"
          Write-Host "=========================================="
          Write-Host "PASSWORD : $password"
          Write-Host "=========================================="

          # Tampilkan juga di GitHub Summary
          @"
          # 🔐 DapaX RDP Credentials

          | Item | Value |
          |---|---|
          | Computer Name | DapaX |
          | Username | DapaX |
          | Password | `$password` |
          | RDP Port | 3389 |

          **Windows App**
          
          Gunakan IP Tailscale yang muncul pada step berikutnya.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # ==========================================
      # RENAME COMPUTER
      # ==========================================
      - name: Rename Windows to DapaX
        shell: pwsh
        run: |
          Write-Host "Renaming Windows computer to DapaX..."

          try {
              Rename-Computer `
                -NewName "DapaX" `
                -Force `
                -ErrorAction Stop

              Write-Host "Computer name configured: DapaX"
              Write-Host "Note: full hostname change may require reboot."
          }
          catch {
              Write-Host "Hostname rename warning:"
              Write-Host $_
          }

      # ==========================================
      # ENABLE RDP
      # ==========================================
      - name: Enable Remote Desktop
        shell: pwsh
        run: |

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."

      # ==========================================
      # CREATE DAPAX USER
      # ==========================================
      - name: Create DapaX RDP User
        shell: pwsh
        run: |

          $username = "DapaX"

          Write-Host "Creating user: DapaX"

          $securePassword = ConvertTo-SecureString `
            "$env:DAPAX_PASSWORD" `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {

              Write-Host "DapaX already exists."
              Write-Host "Updating password..."

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

              Enable-LocalUser `
                -Name $username
          }
          else {

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "DapaX RDP Account"

              Write-Host "DapaX user created."
          }

          # Administrator
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "DapaX" `
            -ErrorAction SilentlyContinue

          # Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "DapaX" `
            -ErrorAction SilentlyContinue

          $user = Get-LocalUser `
            -Name "DapaX"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "           DAPAX USER READY"
          Write-Host "=========================================="
          Write-Host "Username : DapaX"
          Write-Host "Enabled  : $($user.Enabled)"
          Write-Host "=========================================="

      # ==========================================
      # INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: pwsh
        run: |

          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "Tailscale installation failed."
              exit $process.ExitCode
          }

          if (-not (Test-Path "C:\Program Files\Tailscale\tailscale.exe")) {
              Write-Error "tailscale.exe tidak ditemukan."
              exit 1
          }

          Write-Host "Tailscale installed."

      # ==========================================
      # CONNECT TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY belum dibuat di Repository Secrets."
              exit 1
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host "Connecting Tailscale..."

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="dapax-rdp-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale gagal terhubung."
              exit $LASTEXITCODE
          }

          Start-Sleep -Seconds 5

          Write-Host "Tailscale connected."

      # ==========================================
      # FIREWALL
      # ==========================================
      - name: Configure Tailscale RDP Firewall
        shell: pwsh
        run: |

          netsh advfirewall firewall delete rule `
            name="DapaX-RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="DapaX-RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Write-Host "Firewall rule created."

      # ==========================================
      # GET TAILSCALE IP
      # ==========================================
      - name: Get DapaX RDP Address
        shell: pwsh
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          Start-Sleep -Seconds 5

          $ip = & $tailscale ip -4 |
            Select-Object -First 1

          $ip = $ip.ToString().Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
              Write-Error "Tailscale IP tidak ditemukan."
              exit 1
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          DAPAX RDP READY"
          Write-Host "=========================================="
          Write-Host "PC NAME : $ip"
          Write-Host "USER    : DapaX"
          Write-Host "PASSWORD: $env:DAPAX_PASSWORD"
          Write-Host "PORT    : 3389"
          Write-Host "=========================================="

          @"

          # 🖥️ DapaX RDP READY

          ## Connection

          **PC Name / Address**
          `$ip`

          **Username**
          `DapaX`

          **Password**
          `$env:DAPAX_PASSWORD`

          **Port**
          `3389`

          ## Windows App

          Masukkan:

          - PC name: `$ip`
          - Username: `DapaX`
          - Password: `$env:DAPAX_PASSWORD`

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append

      # ==========================================
      # VERIFY RDP
      # ==========================================
      - name: Verify RDP
        shell: pwsh
        run: |

          Write-Host "Testing local RDP port..."

          Start-Sleep -Seconds 3

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if ($test.TcpTestSucceeded) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "       RDP PORT 3389 : ONLINE"
              Write-Host "       DAPAX RDP     : READY"
              Write-Host "=========================================="
          }
          else {

              Write-Error "RDP port 3389 tidak terbuka."
              exit 1
          }

      # ==========================================
      # KEEP ALIVE
      # ==========================================
      - name: Keep DapaX RDP Alive
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          DAPAX RDP ACTIVE"
          Write-Host "=========================================="
          Write-Host "IP       : $env:TAILSCALE_IP"
          Write-Host "Username : DapaX"
          Write-Host "Password : $env:DAPAX_PASSWORD"
          Write-Host ""
          Write-Host "JANGAN CANCEL WORKFLOW."
          Write-Host "=========================================="

          while ($true) {

              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] DapaX RDP ACTIVE"

              Start-Sleep -Seconds 60
          }
