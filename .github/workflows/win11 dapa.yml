name: Windows RDP + Tailscale

on:
  workflow_dispatch:

concurrency:
  group: rdp-session
  cancel-in-progress: false

jobs:
  rdp:
    # x64 lebih cocok untuk emulator Android daripada ARM
    runs-on: windows-latest

    # GitHub-hosted runner bersifat sementara
    timeout-minutes: 350

    steps:

      # =========================================
      # 1. SYSTEM INFO
      # =========================================
      - name: System Information
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "        WINDOWS RDP + TAILSCALE"
          Write-Host "=========================================="

          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          $cs = Get-CimInstance Win32_ComputerSystem
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"

          Write-Host "OS     : $($os.Caption)"
          Write-Host "Build  : $($os.BuildNumber)"
          Write-Host "CPU    : $($cpu.Name)"
          Write-Host "Core   : $($cpu.NumberOfCores)"
          Write-Host "Thread : $($cpu.NumberOfLogicalProcessors)"
          Write-Host "RAM    : $([math]::Round($cs.TotalPhysicalMemory / 1GB,2)) GB"
          Write-Host "Disk   : $([math]::Round($disk.FreeSpace / 1GB,2)) GB free"

          Get-CimInstance Win32_VideoController |
            ForEach-Object {
              Write-Host "GPU    : $($_.Name)"
            }

          Write-Host "=========================================="

      # =========================================
      # 2. ENABLE RDP
      # =========================================
      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP enabled successfully."

      # =========================================
      # 3. CREATE RDP USER
      # =========================================
      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = "rdpadmin"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Error "Secret RDP_PASSWORD belum dibuat."
            exit 1
          }

          Write-Host "Creating RDP user..."

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Write-Host "User already exists. Updating password..."

            $securePassword = ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

            Set-LocalUser `
              -Name $username `
              -Password $securePassword

            Enable-LocalUser `
              -Name $username
          }
          else {
            $securePassword = ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword `
              -ErrorAction Stop | Out-Null

            Enable-LocalUser `
              -Name $username
          }

          # Administrator
          $adminMembers = Get-LocalGroupMember `
            -Group "Administrators" `
            -ErrorAction SilentlyContinue

          if (-not ($adminMembers.Name -match "\\$username$")) {
            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $username `
              -ErrorAction Stop
          }

          # Remote Desktop Users
          $rdpMembers = Get-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -ErrorAction SilentlyContinue

          if (-not ($rdpMembers.Name -match "\\$username$")) {
            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $username `
              -ErrorAction Stop
          }

          $check = Get-LocalUser `
            -Name $username `
            -ErrorAction Stop

          if (-not $check.Enabled) {
            Write-Error "RDP user tidak aktif."
            exit 1
          }

          Write-Host "=========================================="
          Write-Host "RDP USER READY"
          Write-Host "Username : rdpadmin"
          Write-Host "Password : configured from GitHub Secret"
          Write-Host "=========================================="

      # =========================================
      # 4. INSTALL TAILSCALE
      # =========================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Write-Host "Installing Tailscale..."

          $p = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($p.ExitCode -ne 0) {
            Write-Error "Tailscale installation failed: $($p.ExitCode)"
            exit $p.ExitCode
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            Write-Error "tailscale.exe tidak ditemukan."
            exit 1
          }

          Write-Host "Tailscale installed successfully."

      # =========================================
      # 5. CONNECT TAILSCALE
      # =========================================
      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "Secret TAILSCALE_AUTH_KEY belum dibuat."
            exit 1
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-rdp-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tailscale gagal terhubung."
            exit $LASTEXITCODE
          }

          Start-Sleep -Seconds 5

          Write-Host "Tailscale connected."

      # =========================================
      # 6. FIREWALL
      # =========================================
      - name: Configure RDP Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring firewall..."

          netsh advfirewall firewall delete rule `
            name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Write-Host "Firewall configured."

      # =========================================
      # 7. GET TAILSCALE IP
      # =========================================
      - name: Get Tailscale IP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          Start-Sleep -Seconds 5

          $ip = & $tailscale ip -4 |
            Select-Object -First 1

          $ip = $ip.ToString().Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            Write-Error "Tailscale IPv4 tidak ditemukan."
            exit 1
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          RDP CONNECTION"
          Write-Host "=========================================="
          Write-Host "PC Name  : $ip"
          Write-Host "Port     : 3389"
          Write-Host "Username : rdpadmin"
          Write-Host "Password : RDP_PASSWORD secret"
          Write-Host "=========================================="

      # =========================================
      # 8. VERIFY RDP
      # =========================================
      - name: Verify RDP
        shell: pwsh
        run: |
          Write-Host "Checking RDP port..."

          Start-Sleep -Seconds 3

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if ($test.TcpTestSucceeded) {
            Write-Host "=========================================="
            Write-Host "RDP PORT 3389 : OK"
            Write-Host "TAILSCALE IP   : $env:TAILSCALE_IP"
            Write-Host "=========================================="
          }
          else {
            Write-Error "RDP port 3389 tidak terbuka."
            exit 1
          }

      # =========================================
      # 9. KEEP ALIVE
      # =========================================
      - name: Keep RDP Alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       WINDOWS RDP IS READY"
          Write-Host "=========================================="
          Write-Host "PC Name  : $env:TAILSCALE_IP"
          Write-Host "Username : rdpadmin"
          Write-Host "Port     : 3389"
          Write-Host ""
          Write-Host "Gunakan Windows App untuk terhubung."
          Write-Host "Jangan tekan Cancel pada workflow."
          Write-Host "=========================================="

          while ($true) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP ACTIVE"
            Start-Sleep -Seconds 60
          }
